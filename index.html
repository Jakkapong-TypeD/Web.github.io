    <script>
        // กำหนด ID ให้ตรงกับที่ตั้งไว้ในบอร์ด KidBright
        const deviceID = "jakkapong-mq2-data"; 
        const gasThreshold = 2000; // ตั้งค่าระดับแก๊สอันตราย (ปรับเปลี่ยนได้ตามเหมาะสม)
        let hasNotified = false;

        // ฟังก์ชันขออนุญาตแจ้งเตือนบนหน้าจอโทรศัพท์/คอมพิวเตอร์
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("เปิดระบบแจ้งเตือนสำเร็จ! ระบบจะเด้งเตือนเมื่อมีแก๊สรั่ว");
                    }
                });
            } else {
                alert("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนหน้าจอ");
            }
        }

        // ฟังก์ชันดึงค่าจากอินเทอร์เน็ตส่วนกลางมาแสดงบน GitHub Pages
        function fetchGasData() {
            fetch(`https://dweet.io{deviceID}`)
                .then(response => response.json())
                .then(data => {
                    if (data.this === "succeeded" && data.with.length > 0) {
                        const gasValue = data.with[0].content.gas; // ดึงค่าแก๊สล่าสุดออกมา
                        
                        // แสดงผลตัวเลขระดับควัน/แก๊สแทนที่เครื่องหมายแดชเดิม
                        document.getElementById("gas-display").innerText = gasValue;
                        
                        const statusDisplay = document.getElementById("status-display");
                        const gasDisplay = document.getElementById("gas-display");

                        // เงื่อนไขในการเปลี่ยนสีสถานะและส่งข้อความแจ้งเตือนหน้าจอ
                        if (gasValue > gasThreshold) {
                            statusDisplay.innerText = "⚠️ DANGER! พบก๊าซหรือควันไฟ";
                            statusDisplay.className = "status red";
                            gasDisplay.style.color = "#e53e3e";

                            // ส่งเสียงหรือเด้งหน้าต่างแจ้งเตือนบนจอมือถือ (Push Notification)
                            if (!hasNotified && Notification.permission === "granted") {
                                new Notification("🚨 ตรวจพบสัญญาณอันตราย!", {
                                    body: `ขณะนี้ค่าควันและก๊าซพุ่งสูงเกินเกณฑ์: ${gasValue}`,
                                    icon: "https://flaticon.com"
                                });
                                hasNotified = true; // ล็อกไว้เพื่อไม่ให้แจ้งเตือนเด้งรัวๆ
                            }
                        } else {
                            statusDisplay.innerText = "✅ System Normal (ปกติ)";
                            statusDisplay.className = "status green";
                            gasDisplay.style.color = "#3182ce";
                            hasNotified = false; // ปลดล็อกเมื่อกลับสู่สถานะปกติ ปลอดภัยดี
                        }
                    }
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        // ตั้งเวลาให้หน้าเว็บดึงข้อมูลมาเปลี่ยนตัวเลขเองโดยอัตโนมัติทุกๆ 2 วินาที (ไม่ต้องกดรีเฟรชหน้าเว็บ)
        setInterval(fetchGasData, 2000);
        fetchGasData();
    </script>
